# Blueprint Render — Evolution API para PetVia (sem PC)
# New → Blueprint → repo menorapet → path: deploy/evolution/render.yaml
#
# Depois do deploy: defina SERVER_URL = https://<nome-do-servico>.onrender.com

services:
  - type: web
    name: petvia-evolution-api
    runtime: image
    image:
      url: docker.io/atendai/evolution-api:v2.2.3
    plan: starter
    healthCheckPath: /
    envVars:
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: '8080'
      # Obrigatório após o 1º deploy: URL pública com https (painel Render → Environment)
      - key: SERVER_URL
        sync: false
      - key: DEL_INSTANCE
        value: 'false'
      - key: DATABASE_ENABLED
        value: 'true'
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: petvia-evolution-db
          property: connectionString
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: petvia_evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: 'true'
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: 'true'
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: 'true'
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: 'true'
      - key: DATABASE_SAVE_DATA_CHATS
        value: 'true'
      - key: CACHE_REDIS_ENABLED
        value: 'false'
      - key: CACHE_LOCAL_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: ERROR,WARN
      - key: CORS_ORIGIN
        value: '*'
      - key: CORS_METHODS
        value: GET,POST,PUT,DELETE
      - key: CORS_CREDENTIALS
        value: 'true'
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Chrome

databases:
  - name: petvia-evolution-db
    plan: free
    databaseName: evolution
    user: evolution
